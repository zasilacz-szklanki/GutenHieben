<!doctype html>
<head>
    <title>Logowanie - GutCloud</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<html>
   <body>
     <main class="form-signin w-100 m-auto">
        <div class="px-4 py-3 my-2 text-center">
            <img class="mb-4" src="{{ url_for('static', filename='images/black_cloud_logo.svg') }}" alt="Logo" width="72" height="72">
            <h1 class="h3 mb-3 fw-normal">Zaloguj się</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}" class="w-50 mx-auto">
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Nazwa użytkownika" required>
                    <label for="floatingInput">Nazwa użytkownika</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Hasło" required>
                    <label for="floatingPassword">Hasło</label>
                </div>

                <button class="w-100 btn btn-lg btn-primary" type="submit">Zaloguj</button>
                <div class="mt-3">
                    <a href="{{ url_for('register') }}">Załóż konto</a>
                </div>
            </form>
          </div>
     </main>  
   </body>
</html>
